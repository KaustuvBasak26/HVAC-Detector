# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Dashboard → New → Blueprint → connect this repo.
#
# Free tier: 512 MB RAM — low-memory mode auto-enables demo cleanup and a 10 MB upload cap.

services:
  - type: web
    name: hvac-detector
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    branch: main
    autoDeployTrigger: commit
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HVAC_DATA_DIR
        value: /data
      - key: HVAC_SECURE_DEPLOYMENT
        value: "true"
      - key: HVAC_VIEWER_TOKEN_SECRET
        generateValue: true
      - key: HVAC_LOW_MEMORY_MODE
        value: "true"
      - key: HVAC_RENDER_DPI
        value: "96"
      - key: HVAC_LOW_MEMORY_MAX_DPI
        value: "96"
      - key: HVAC_LOW_MEMORY_MAX_SIDE_PX
        value: "2400"
      - key: HVAC_DEMO_MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: HVAC_VIEWER_TOKEN_TTL_SECONDS
        value: "7200"
      - key: PYTHONUNBUFFERED
        value: "1"
